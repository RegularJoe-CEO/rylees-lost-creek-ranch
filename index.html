<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Lost Creek Ranch"/>
<title>Lost Creek Ranch</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:#0d1f18;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
#app{height:100dvh;width:100%;display:flex;flex-direction:column;overflow:hidden;background:#143028;position:relative}
svg{flex:1;min-height:0;width:100%;display:block;cursor:default}
[data-act]{cursor:pointer}
.hud{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));z-index:5}
.hud b,.hud button{border:0;border-radius:999px;padding:10px 14px;font:800 14px/1 -apple-system,sans-serif;background:#fff;box-shadow:0 6px 16px #0003}
.hud .grow{flex:1;text-align:center;background:#fffc}
.hint{flex:0 0 auto;margin:0 auto 8px;background:#111c;color:#fff;padding:10px 16px;border-radius:999px;font:700 15px/1.25 -apple-system,sans-serif;max-width:92%;text-align:center}
#app.has-picks .hint{display:none}
.help{position:absolute;z-index:7;max-width:min(320px,88vw);background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 28px #0004;font:500 15px/1.4 -apple-system,sans-serif;top:70px;left:12px}
.help strong{display:block;color:#8b3a22;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.dock{flex:0 0 auto;background:#0b1a14;padding:12px 12px calc(14px + env(safe-area-inset-bottom));border-top:2px solid #2a4a3a}
.q{color:#fff;font:800 18px/1.3 -apple-system,sans-serif;text-align:center;margin:0 0 10px}
.pickrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pickrow button{border:0;border-radius:14px;padding:14px 16px;min-height:48px;min-width:110px;font:800 15px -apple-system,sans-serif;background:#fff;box-shadow:0 8px 18px #0003}
.pickrow button.ok{background:#b7e38a}
.pickrow button.no{background:#f5b8ae}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <button onclick="go('ranch')">Ranch</button>
    <b class="grow" id="where">Lost Creek Ranch</b>
    <button onclick="ask()">?</button>
    <b id="stars">0</b>
  </div>
  <svg id="sc" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="hint" class="hint"></div>
  <div id="help" class="help hide"></div>
  <div id="dock" class="dock hide">
    <div id="q" class="q"></div>
    <div id="picks" class="pickrow"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const ST=JSON.parse(localStorage.getItem('lcr5')||'{"stars":0}');
const save=()=>localStorage.setItem('lcr5',JSON.stringify(ST));
const stars=()=>$('stars').textContent=ST.stars;
let scene='ranch', helpTxt='', bank=[], qi=0, afterDraw=null, locked=false;
function sky(d){return `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${d?'#e88948':'#74c3d8'}"/><stop offset="1" stop-color="${d?'#f3d7a0':'#cfe89a'}"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8a96"/><stop offset="1" stop-color="#163e48"/></linearGradient></defs><rect width="1000" height="620" fill="url(#sky)"/><circle cx="860" cy="70" r="44" fill="${d?'#ffd08a':'#ffe27a'}"/>`}
function hills(){return `<path d="M0 260 C160 200 280 240 420 190 C580 130 720 210 1000 170 L1000 420 L0 420Z" fill="#3a6e3c"/><path d="M0 320 C200 260 380 310 560 270 C740 230 880 300 1000 270 L1000 440 L0 440Z" fill="#2b5530"/>`}
function tree(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s||1})"><rect x="-7" y="30" width="14" height="50" rx="2" fill="#6a4224"/><ellipse cy="10" rx="36" ry="42" fill="#2f6d38"/><ellipse cx="-16" cy="-8" rx="20" ry="22" fill="#3f8a46"/></g>`}
function rylee(x,y){return `<g transform="translate(${x} ${y})"><ellipse cy="78" rx="20" ry="7" fill="#0003"/><rect x="-10" y="52" width="9" height="24" rx="2" fill="#2d3d55"/><rect x="3" y="52" width="9" height="24" rx="2" fill="#2d3d55"/><rect x="-16" y="24" width="32" height="32" rx="7" fill="#3f7a46"/><circle cy="8" r="15" fill="#f0c49a"/><path d="M-15 4 C-16 -14 16 -14 15 4 C8 -6 -8 -6 -15 4" fill="#5a3218"/><circle cx="-5" cy="8" r="2" fill="#2a1c10"/><circle cx="5" cy="8" r="2" fill="#2a1c10"/></g>`}
function friend(x,y){return `<g transform="translate(${x} ${y})"><ellipse cy="102" rx="28" ry="9" fill="#0003"/><rect x="-18" y="68" width="15" height="32" rx="3" fill="#3d2a1c"/><rect x="4" y="68" width="15" height="32" rx="3" fill="#3d2a1c"/><rect x="-26" y="28" width="52" height="46" rx="8" fill="#8b3a22"/><rect x="-26" y="44" width="52" height="6" fill="#d9c08a"/><circle cy="6" r="19" fill="#f0c49a"/><path d="M-18 2 C-20 -16 20 -16 18 2" fill="#5c2e16"/><path d="M-17 10 C-18 34 18 34 17 10 C10 22 -10 22 -17 10" fill="#8a3d22"/><circle cx="-6" cy="4" r="2" fill="#2a1c10"/><circle cx="6" cy="4" r="2" fill="#2a1c10"/></g>`}
function mama(x,y){return `<g transform="translate(${x} ${y})"><path d="M-14 28 C-16 70 -8 76 0 76 C8 76 16 70 14 28Z" fill="#c45c6a"/><circle cy="10" r="13" fill="#f0c49a"/><path d="M-14 4 C-18 14 -16 36 -6 32 C-2 14 2 14 6 32 C16 36 18 14 14 4 C8 -12 -8 -12 -14 4Z" fill="#4a2c18"/></g>`}
function elvis(x,y){return `<g transform="translate(${x} ${y})"><ellipse cy="44" rx="10" ry="4" fill="#0003"/><rect x="-8" y="22" width="16" height="20" rx="5" fill="#5a7a9a"/><circle cy="10" r="10" fill="#f0c49a"/><path d="M-8 8 C-9 -5 9 -5 8 8" fill="#5a3218"/></g>`}
function nana(x,y){return `<g transform="translate(${x} ${y})"><rect x="-18" y="30" width="36" height="40" rx="6" fill="#7a4aa0"/><rect x="-20" y="30" width="40" height="10" fill="#efe6c8"/><circle cy="12" r="14" fill="#f0c49a"/><path d="M-14 8 C-16 -10 16 -10 14 8" fill="#d8d0b8"/></g>`}
function bass(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s||1})"><ellipse rx="54" ry="22" fill="#3f8a3a"/><path d="M48 0 L74 -16 L66 0 L74 16Z" fill="#2f6a2c"/><circle cx="-28" cy="-3" r="4" fill="#e8e0c0"/><circle cx="-28" cy="-3" r="2" fill="#111"/></g>`}
function bassHit(x,y){return `<g transform="translate(${x} ${y}) scale(1.4)"><circle r="70" fill="#0000" pointer-events="all"/><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="1.6s" repeatCount="indefinite"/><ellipse rx="54" ry="22" fill="#3f8a3a"/><path d="M48 0 L74 -16 L66 0 L74 16Z" fill="#2f6a2c"/><circle cx="-28" cy="-3" r="4" fill="#e8e0c0"/><circle cx="-28" cy="-3" r="2" fill="#111"/></g></g>`}
function tin(x,y){return `<g transform="translate(${x} ${y})"><rect x="-11" y="-30" width="22" height="30" rx="2" fill="#c45c12"/><ellipse cy="-30" rx="11" ry="5" fill="#e07028"/><ellipse cy="0" rx="11" ry="4" fill="#8a3010"/><text y="-12" text-anchor="middle" fill="#fff" font-size="8">can</text></g>`}
function house(){return `<g transform="translate(620 180)"><polygon points="0,70 110,0 220,70" fill="#6b2a22"/><rect x="20" y="70" width="180" height="110" fill="#c4a46a"/><rect x="90" y="110" width="40" height="70" fill="#5a3416"/><rect x="40" y="90" width="30" height="24" fill="#8ec8e0"/><rect x="150" y="90" width="30" height="24" fill="#8ec8e0"/><rect x="0" y="170" width="220" height="16" fill="#8a562c"/><text x="110" y="64" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">Grandma</text></g>`}
function truck(){return `<g transform="translate(760 360)"><rect x="10" y="48" width="170" height="50" rx="6" fill="#c45c12"/><rect x="118" y="18" width="62" height="40" rx="4" fill="#9a3a10"/><rect x="128" y="26" width="36" height="18" fill="#8ec8e0"/><circle cx="44" cy="98" r="14" fill="#1c1916"/><circle cx="150" cy="98" r="14" fill="#1c1916"/><rect x="18" y="54" width="90" height="36" rx="3" fill="#efe6c8"/><text x="95" y="12" text-anchor="middle" font-size="13" font-weight="800">JACKSBORO SHELTER</text><text x="63" y="76" text-anchor="middle" font-size="11">truck</text></g>`}
function pole(x,y){return `<g transform="translate(${x} ${y})"><line x1="0" y1="0" x2="90" y2="-110" stroke="#6b4423" stroke-width="4"/><line x1="90" y1="-110" x2="220" y2="-10" stroke="#d7e8ee" stroke-width="1.5"/></g>`}
function critter(){return `<g><ellipse cx="28" cy="40" rx="16" ry="10" fill="#5a4030"/><circle cx="16" cy="32" r="8" fill="#5a4030"/><circle cx="13" cy="30" r="1.4" fill="#111"/><ellipse cx="8" cy="28" rx="4" ry="5" fill="#3a2a20"/><ellipse cx="20" cy="28" rx="4" ry="5" fill="#3a2a20"/><ellipse cx="42" cy="40" rx="5" ry="3" fill="#5a4030"/></g>`}
function cage(x,y,t,i){
  const label=!t.open?'check':(t.full?'got one':'empty');
  const door=t.open?`<rect x="58" y="8" width="8" height="44" rx="1" fill="#c4a46a"/>`:`<rect x="4" y="8" width="8" height="44" rx="1" fill="#8a6a3a"/>`;
  const inside=(!t.open||!t.full)?'':critter();
  return `<g data-act="trap${i}" transform="translate(${x} ${y})"><rect width="70" height="60" rx="4" fill="${t.open?'#e8d7a8':'#6b7a6b'}" stroke="#2a2a22" stroke-width="2"/><rect x="8" y="8" width="54" height="36" fill="${t.open?'#f6edd4':'#4a5a4a'}" stroke="#2a2a22"/><line x1="8" y1="8" x2="8" y2="44" stroke="#2a2a22"/><line x1="22" y1="8" x2="22" y2="44" stroke="#2a2a22"/><line x1="36" y1="8" x2="36" y2="44" stroke="#2a2a22"/><line x1="50" y1="8" x2="50" y2="44" stroke="#2a2a22"/>${inside}${door}<text x="35" y="56" text-anchor="middle" font-size="10" font-weight="700">${label}</text></g>`;
}
function ripples(n){let s='';for(let i=0;i<n;i++){const x=280+i*160;s+=`<ellipse cx="${x}" cy="470" rx="40" ry="12" fill="none" stroke="#d5f3f8" stroke-width="3"/><circle cx="${x}" cy="470" r="6" fill="#c4a46a"/>`;}return s}
function pvc(){
  const places=['Thousands','Hundreds','Tens','Ones'];
  const w=900/places.length;
  let cells='';
  places.forEach((p,i)=>{cells+=`<rect x="${50+i*w}" y="40" width="${w-6}" height="70" rx="8" fill="#1f4a3a" stroke="#f3e2b0"/><text x="${50+i*w+w/2-3}" y="82" text-anchor="middle" fill="#f3e2b0" font-size="13" font-weight="700">${p}</text>`;});
  return cells;
}
function hint(t){$('hint').textContent=t||'';$('hint').classList.toggle('hide',!t)}
function ask(){const h=$('help');if(h.classList.contains('hide')){h.classList.remove('hide');h.innerHTML='<strong>Friend</strong>'+(helpTxt||'Tap the glowing thing, bud.');}else h.classList.add('hide')}
function hideHelp(){$('help').classList.add('hide')}
function clearUI(){$('app').classList.remove('has-picks');$('dock').classList.add('hide');$('q').textContent='';$('picks').innerHTML='';hideHelp()}
function showFriend(msg){helpTxt=msg;const h=$('help');h.classList.remove('hide');h.innerHTML='<strong>Friend</strong>'+msg}
function picks(question,opts){
  $('app').classList.add('has-picks');
  $('dock').classList.remove('hide');
  $('q').textContent=question;
  $('picks').innerHTML=opts.map((o,i)=>`<button id="b${i}">${o.t}</button>`).join('');
  opts.forEach((o,i)=>{const btn=$(`b${i}`);if(!btn)return;btn.onclick=()=>choose(o,btn)});
}
function choose(o,btn){
  if(locked)return;
  if(o.ok){locked=true;if(btn)btn.className='ok';hideHelp();ST.stars++;save();stars();setTimeout(advance,500)}
  else{if(btn)btn.className='no';showFriend(o.hint||'Not quite. Look again and try another one.')}
}
function bind(){$('sc').onclick=e=>{const t=e.target.closest('[data-act]');if(t)act(t.getAttribute('data-act'))}}
function go(name){scene=name;qi=0;locked=false;clearUI();hideHelp();if(name==='ranch')ranch();else if(name==='fish')fish();else if(name==='range')range();else if(name==='trap')trap();else if(name==='grandma')seeGrandma()}
function act(a){
  if(a==='hole')go('fish');
  else if(a==='range')go('range');
  else if(a==='trap')go('trap');
  else if(a==='cast')cast();
  else if(a==='reel')askQ();
  else if(a==='shoot'){if(qi===0&&!document.getElementById('b0'))askQ()}
  else if(a.startsWith('trap'))checkTrap(+a.slice(4));
  else if(a==='skip')skip();
}
function advance(){qi++;clearUI();if(qi<bank.length)askQ();else seeGrandma()}
function askQ(){
  const item=bank[qi];
  if(!item){seeGrandma();return}
  locked=false;
  helpTxt=item.h;
  if(afterDraw)afterDraw(item);
  picks(item.q+'  ('+(qi+1)+' of '+bank.length+')', item.opts);
}
function ranch(){
  $('where').textContent='Lost Creek Ranch';
  helpTxt='Hey bud. School is working place value — the 10-times rule, naming big numbers, and writing them three ways. Pick a place and we will practice while we fish, shoot, and run the traps.';
  hint('Hey bud — pick a place');
  $('sc').innerHTML=sky()+hills()+tree(40,220,.8)+tree(940,230,.9)+
    `<g data-act="hole">
       <ellipse cx="200" cy="470" rx="170" ry="78" fill="url(#w)" stroke="#ffe27a" stroke-width="4"/>
       <text x="200" y="420" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">THE HOLE</text>
       <text x="200" y="448" text-anchor="middle" fill="#fff" font-size="13">10× place value</text>
       <text x="200" y="470" text-anchor="middle" fill="#ffe27a" font-size="12">BB Lesson 2</text>
     </g>
     <g data-act="range">
       <rect x="400" y="400" width="230" height="130" rx="12" fill="#c4a46a" stroke="#ffe27a" stroke-width="4"/>
       <rect x="420" y="448" width="190" height="10" fill="#6b4423"/>
       <text x="515" y="430" text-anchor="middle" font-size="20" font-weight="800">RANGE</text>
       <text x="515" y="470" text-anchor="middle" font-size="13">standard · expanded · words</text>
       <text x="515" y="495" text-anchor="middle" fill="#6b4423" font-size="12">BB Lesson 4</text>
     </g>
     <g data-act="trap">
       <rect x="670" y="400" width="280" height="130" rx="12" fill="#2f5530" stroke="#ffe27a" stroke-width="4"/>
       <text x="810" y="430" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">TRAPLINE</text>
       <text x="810" y="458" text-anchor="middle" fill="#fff" font-size="13">value of a digit</text>
       <text x="810" y="482" text-anchor="middle" fill="#ffe27a" font-size="12">BB Lesson 3</text>
     </g>`
    +tin(455,448)+tin(515,448)+tin(575,448)
    +rylee(360,300)+friend(470,278)+mama(580,308)+elvis(640,360);
}
const FISH=[
  {q:'5 thousands is the same as how many hundreds?',
   h:'Remember: each place is 10 times the place to its right. So 1 thousand = 10 hundreds. That means 5 thousands = 50 hundreds.',
   opts:[{t:'50 hundreds',ok:1},{t:'5 hundreds',hint:'Nope. 1 thousand = 10 hundreds, so 5 thousands is 5 × 10 = 50 hundreds.'},{t:'500 hundreds',hint:'Too big. 5 × 10 = 50, not 500.'}]},
  {q:'10 × 3 thousands = ?',
   h:'When you multiply by 10, every digit shifts one place to the LEFT. 3 thousands becomes 3 ten thousands. That is also 30 thousands.',
   opts:[{t:'30 thousands',ok:1},{t:'3 hundreds',hint:'Multiplying by 10 makes it bigger, not smaller.'},{t:'3 thousands',hint:'You have to shift. 10 × 3 thousands = 30 thousands.'}]},
  {q:'7 hundreds × 10 = ?',
   h:'7 hundreds times 10. Each hundred becomes a thousand. So you get 7 thousands. You can also say 70 hundreds.',
   opts:[{t:'7 thousands',ok:1},{t:'70 thousands',hint:'That would be if you multiplied by 100. Just ×10.'},{t:'7 tens',hint:'Multiplying by 10 makes the number bigger.'}]}
];
function fish(){
  $('where').textContent='The Hole · Lesson 2';
  bank=FISH;qi=0;afterDraw=drawFishQ;
  helpTxt='This is Bluebonnet Lesson 2 — the Great Value Match idea. Every place is 10 times the place on its right. Cast, catch a bass, then match the values.';
  hint('Click the lake to cast');
  $('sc').innerHTML=sky()+hills()+tree(40,220,.8)+
    `<rect y="360" width="1000" height="260" fill="url(#w)" data-act="cast"/>
     <rect x="0" y="348" width="300" height="22" fill="#8a562c"/>
     <text x="620" y="450" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">click the lake to cast</text>
     <text x="620" y="485" text-anchor="middle" fill="#d5f3f8" font-size="16">10× place value practice</text>`
    +rylee(110,280)+pole(125,278)+friend(220,258);
}
function drawFishQ(item){
  $('sc').innerHTML=sky()+hills()+
    `<rect y="360" width="1000" height="260" fill="url(#w)"/>
     <text x="500" y="55" text-anchor="middle" font-size="20" font-weight="800">Place value · 10 times as much</text>
     <text x="500" y="85" text-anchor="middle" font-size="14">Friend: each step left is ×10</text>`
    +pvc()
    +rylee(80,200)+friend(170,178)+bass(720,280,1.1);
}
function cast(){
  hint('Waiting on a bite...');
  $('sc').innerHTML=sky()+hills()+
    `<rect y="360" width="1000" height="260" fill="url(#w)"/>
     <rect x="0" y="348" width="300" height="22" fill="#8a562c"/>
     <ellipse cx="640" cy="440" rx="50" ry="16" fill="none" stroke="#d5f3f8" stroke-width="4"/>
     <text x="640" y="390" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">waiting on a bite</text>`
    +rylee(110,280)+pole(125,278)+friend(220,258);
  setTimeout(()=>{
    if(scene!=='fish')return;
    hint('FISH ON — click the bass');
    $('sc').innerHTML=sky()+hills()+
      `<rect y="360" width="1000" height="260" fill="url(#w)" data-act="reel"/>
       <rect x="0" y="348" width="300" height="22" fill="#8a562c"/>
       <text x="620" y="360" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">FISH ON — click the bass</text>`
      +rylee(110,280)+pole(125,278)+friend(220,258)+
      `<g data-act="reel">${bassHit(640,430)}</g>`;
  },800);
}
const RANGE=[
  {q:'What is 4,582 in expanded notation?',
   h:'Expanded notation writes each digit times its place. 4 is in thousands, 5 in hundreds, 8 in tens, 2 in ones. So (4 × 1,000) + (5 × 100) + (8 × 10) + (2 × 1).',
   opts:[{t:'(4×1000)+(5×100)+(8×10)+(2×1)',ok:1},{t:'(4×100)+(5×10)+(8×1)',hint:'That is only three digits. Look at all four places.'},{t:'4582 × 10',hint:'That is multiplying, not expanded notation.'}]},
  {q:'Which is the word form of 90,523?',
   h:'Read the thousands period first, then the rest. 90 thousands is ninety thousand. Then 523 is five hundred twenty-three. Put a comma between the periods when you write it.',
   opts:[{t:'ninety thousand, five hundred twenty-three',ok:1},{t:'nine hundred five thousand, twenty-three',hint:'The 9 is in the ten-thousands place, not the hundred-thousands.'},{t:'ninety-five thousand, twenty-three',hint:'There is a 0 in the thousands place. Do not skip it when you read.'}]},
  {q:'(7 × 1,000) + (3 × 100) + (6 × 1) = ?',
   h:'Add the values: 7 thousands = 7,000. 3 hundreds = 300. 6 ones = 6. Put them together: 7,306. Notice there is no tens term — that place is zero.',
   opts:[{t:'7,306',ok:1},{t:'7,360',hint:'The 6 is in the ones place, not the tens. There is no tens term in the expanded form.'},{t:'736',hint:'You dropped the thousands. 7 × 1,000 is 7,000.'}]}
];
function range(){
  $('where').textContent='The Range · Lesson 4';
  bank=RANGE;qi=0;afterDraw=drawRangeQ;
  helpTxt='This is Bluebonnet Lesson 4 — the Place Value Scoot skills. You write the same number three ways: standard (digits), word form, and expanded notation. Click a can and we will practice.';
  hint('Click a can on the rail');
  $('sc').innerHTML=sky(1)+
    `<rect y="360" width="1000" height="260" fill="#c4a46a"/>
     <rect x="150" y="318" width="620" height="16" fill="#6b4423"/>
     <text x="500" y="80" text-anchor="middle" font-size="24" font-weight="800">BB gun range</text>
     <text x="500" y="115" text-anchor="middle" font-size="16">standard · word · expanded</text>
     <g data-act="shoot">${tin(250,318)+tin(390,318)+tin(530,318)+tin(670,318)}</g>`
    +rylee(140,400)+friend(240,378);
}
function drawRangeQ(item){
  $('sc').innerHTML=sky(1)+
    `<rect y="360" width="1000" height="260" fill="#c4a46a"/>
     <rect x="150" y="318" width="620" height="16" fill="#6b4423"/>
     <text x="500" y="70" text-anchor="middle" font-size="18" font-weight="800">Write numbers three ways</text>
     <text x="500" y="100" text-anchor="middle" font-size="14">standard · word form · expanded notation</text>`
    +pvc()
    +tin(250,318)+tin(390,318)+tin(530,318)+tin(670,318)
    +rylee(140,400)+friend(240,378);
}
const TRAPQ=[
  {q:'In 36,427 what is the VALUE of the digit 6?',
   h:'The 6 is sitting in the thousands place. So its value is 6 × 1,000 = 6,000. The place tells you the value.',
   opts:[{t:'6,000',ok:1},{t:'6',hint:'That is the digit, not its value. Look which place it is in.'},{t:'60',hint:'That would be if the 6 were in the tens place.'}]},
  {q:'In 58,103 which digit is in the hundreds place?',
   h:'Write it with places: 5 ten-thousands, 8 thousands, 1 hundred, 0 tens, 3 ones. The hundreds digit is 1.',
   opts:[{t:'1',ok:1},{t:'8',hint:'8 is in the thousands place.'},{t:'0',hint:'0 is in the tens place.'}]},
  {q:'What is the value of the 4 in 42,816?',
   h:'4 is in the ten-thousands place. 4 × 10,000 = 40,000. That is its value.',
   opts:[{t:'40,000',ok:1},{t:'4,000',hint:'That would be the thousands place. Count the places from the right.'},{t:'400',hint:'Too small. Ten-thousands is two places left of hundreds.'}]}
];
let traps;
function trap(){
  $('where').textContent='The Trapline · Lesson 3';
  bank=TRAPQ;qi=0;afterDraw=drawTrapQ;
  traps=Array(12).fill(0).map((_,i)=>({open:0,full:i>4}));
  helpTxt='Lesson 3 is about naming numbers and finding the value of each digit. Open every cage first — full ones ride to the Jacksboro shelter — then we will find digit values.';
  drawTraps();
}
function trapBoxes(){
  let boxes='';
  traps.forEach((t,i)=>{const col=i<6?i:i-6;boxes+=cage(40+col*115,i<6?170:260,t,i)});
  return boxes;
}
function drawTraps(){
  const open=traps.filter(t=>t.open).length;
  hint(open<12?'Click each cage. Full ones ride in the truck.':'All cages checked. Answer below.');
  $('sc').innerHTML=sky()+hills()+
    `<rect y="400" width="1000" height="220" fill="#2b5530"/>
     <text x="40" y="155" font-size="16" font-weight="800">12 humane traps</text>`
    +trapBoxes()+truck()+rylee(40,430)+friend(130,408);
  if(open===12&&!$('app').classList.contains('has-picks'))askQ();
}
function drawTrapQ(){
  $('sc').innerHTML=sky()+hills()+
    `<rect y="400" width="1000" height="220" fill="#2b5530"/>
     <text x="40" y="140" font-size="16" font-weight="800">Value of a digit</text>
     <text x="40" y="165" font-size="13">Friend: the place tells you the value</text>`
    +trapBoxes()+truck()+rylee(40,400)+friend(130,378);
}
function checkTrap(i){if(!traps[i].open){traps[i].open=1;drawTraps()}}
function seeGrandma(){
  scene='grandma';clearUI();
  $('where').textContent="Grandma's creek";
  helpTxt='You finished the set. Next week at school they move into comparing and ordering big numbers (Lesson 5 and 6). For now — skip a rock with Grandma.';
  hint('Click the creek to skip a rock');
  window._sk=0;
  $('sc').innerHTML=sky(1)+hills()+
    `<rect y="380" width="1000" height="240" fill="url(#w)"/>
     <text x="420" y="70" text-anchor="middle" font-size="26" font-weight="800">Rylee! You did it</text>
     <text x="420" y="100" text-anchor="middle" font-size="15">Next up: compare and order big numbers</text>
     <text x="280" y="430" fill="#fff" font-size="24" font-weight="800">Lost Creek</text>
     <text x="280" y="460" fill="#fff" font-size="16">skip 3 times</text>`
    +house()+nana(200,300)+rylee(90,360)+friend(280,340)+elvis(160,380)+
    `<rect y="380" width="1000" height="240" fill="#0000" data-act="skip"/>`;
}
function skip(){
  window._sk=(window._sk||0)+1;
  const n=window._sk;
  hint(n===1?'One hop. Click again.':n===2?'Two hops. One more.':'Three hops. That is a good skip.');
  $('sc').innerHTML=sky(1)+hills()+
    `<rect y="380" width="1000" height="240" fill="url(#w)"/>
     <text x="280" y="430" fill="#fff" font-size="24" font-weight="800">Lost Creek · ${Math.min(n,3)} / 3</text>`
    +ripples(Math.min(n,3))+house()+nana(200,300)+rylee(90,360)+friend(280,340)+elvis(160,380)+
    `<rect y="380" width="1000" height="240" fill="#0000" data-act="skip"/>`;
  if(n>=3){ST.stars+=2;save();stars();setTimeout(()=>go('ranch'),1200)}
}
stars();
bind();
go('ranch');
</script>
