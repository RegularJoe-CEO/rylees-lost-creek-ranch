<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Lost Creek Ranch"/>
<title>Lost Creek Ranch</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f241c;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1c1916}
#app{position:relative;height:100dvh;max-width:430px;margin:0 auto;overflow:hidden;background:#6eb7c8}
svg{display:block;width:100%;height:100%}
.nav{position:absolute;top:calc(6px + env(safe-area-inset-top));left:10px;right:10px;z-index:8;display:flex;gap:8px;align-items:center}
.nav button,.chip{border:0;border-radius:999px;padding:10px 14px;font:700 14px/1 -apple-system,sans-serif;background:#fff;color:#1c1916;box-shadow:0 6px 16px #0002}
.nav .grow{flex:1;text-align:center;background:#fff9;backdrop-filter:blur(8px)}
.chip.gold{background:#f3c14a}
.bubble{position:absolute;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));background:#fff;border-radius:20px;padding:14px 16px;z-index:6;box-shadow:0 12px 30px #0003}
.bubble strong{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#c45c12;margin-bottom:6px}
.acts{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:16px;padding:15px 10px;font:800 16px/1.1 -apple-system,sans-serif;background:#f3c14a;color:#1c1400}
.btn.pine{background:#1f4a3a;color:#fff}
.btn.ghost{background:#fff;color:#1c1916}
.choice{display:flex;flex-direction:column;gap:8px;position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:7}
.pick{border:0;border-radius:16px;background:#fff;padding:14px;font:750 16px/1.25 -apple-system,sans-serif;text-align:left;box-shadow:0 8px 18px #0002}
.pick.ok{background:#b7e38a}
.pick.no{background:#f5b8ae}
.hide{display:none!important}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.splash{animation:spl .6s ease-out}
@keyframes spl{from{opacity:.8}to{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div class="nav">
    <button onclick="back()">Back</button>
    <div class="chip grow" id="where">Lost Creek Ranch</div>
    <button class="gold" onclick="ranch()">Ranch</button>
    <div class="chip" id="stars">0</div>
  </div>
  <svg id="sc" viewBox="0 0 360 640" preserveAspectRatio="xMidYSlice"></svg>
  <div id="talk" class="bubble hide"></div>
  <div id="acts" class="acts"></div>
  <div id="choice" class="choice hide"></div>
</div>
<script src="art.js"></script>
<script src="story.js"></script>
</body>
</html>
